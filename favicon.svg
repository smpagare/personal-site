<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldRich" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c674"/>
      <stop offset="50%" stop-color="#c9a44a"/>
      <stop offset="100%" stop-color="#8b6920"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c468"/>
      <stop offset="50%" stop-color="#d4af4a"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
  </defs>

  <!-- White medallion base -->
  <circle cx="50" cy="50" r="49" fill="#ffffff"/>

  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#goldRing)" stroke-width="2"/>
  <!-- Inner thin decorative gold ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldRing)" stroke-width="0.6" opacity="0.7"/>

  <!-- Top flourish -->
  <circle cx="50" cy="22" r="1.2" fill="url(#goldRich)"/>
  <path d="M 42 24 Q 50 21 58 24" stroke="url(#goldRich)" stroke-width="0.7" fill="none" opacity="0.7"/>

  <!-- Bottom flourish -->
  <circle cx="50" cy="78" r="1.2" fill="url(#goldRich)"/>
  <path d="M 42 76 Q 50 79 58 76" stroke="url(#goldRich)" stroke-width="0.7" fill="none" opacity="0.7"/>

  <!-- SP Monogram - elegant Didot/Bodoni style -->
  <text x="50" y="64"
        font-family="'Didot', 'Bodoni 72', 'Bodoni MT', 'Playfair Display', Georgia, serif"
        font-size="44"
        font-weight="500"
        font-style="italic"
        fill="url(#goldRich)"
        text-anchor="middle"
        letter-spacing="-2">SP</text>
</svg>
