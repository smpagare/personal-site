<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e3a3"/>
      <stop offset="50%" stop-color="#d4af4a"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c468"/>
      <stop offset="60%" stop-color="#c9a44a"/>
      <stop offset="100%" stop-color="#8b6920"/>
    </linearGradient>
  </defs>
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="48" fill="url(#goldRing)"/>
  <!-- White inner medal -->
  <circle cx="50" cy="50" r="42" fill="#ffffff"/>
  <!-- Inner gold accent ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.85"/>
  <!-- Laurel branch left -->
  <path d="M 18 50 Q 22 40 26 35 M 22 45 Q 26 40 30 38 M 22 52 Q 26 50 30 50 M 22 58 Q 26 56 30 56" stroke="url(#goldRing)" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Laurel branch right -->
  <path d="M 82 50 Q 78 40 74 35 M 78 45 Q 74 40 70 38 M 78 52 Q 74 50 70 50 M 78 58 Q 74 56 70 56" stroke="url(#goldRing)" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <!-- Initials -->
  <text x="50" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" font-style="italic" fill="url(#goldText)" text-anchor="middle" letter-spacing="-1">SP</text>
</svg>
