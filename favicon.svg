<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4d77a"/>
      <stop offset="50%" stop-color="#d4af4a"/>
      <stop offset="100%" stop-color="#9c7a20"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b94a"/>
      <stop offset="100%" stop-color="#7a5e15"/>
    </linearGradient>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="48" fill="url(#gold)"/>
  <!-- White interior -->
  <circle cx="50" cy="50" r="44" fill="#ffffff"/>
  <!-- Thin inner gold ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldDeep)" stroke-width="0.6" opacity="0.6"/>

  <!-- Laurel wreath: left side -->
  <g fill="url(#gold)" stroke="url(#goldDeep)" stroke-width="0.3">
    <ellipse cx="22" cy="38" rx="2.8" ry="1.4" transform="rotate(-50 22 38)"/>
    <ellipse cx="20" cy="46" rx="2.8" ry="1.4" transform="rotate(-30 20 46)"/>
    <ellipse cx="20" cy="54" rx="2.8" ry="1.4" transform="rotate(-150 20 54)"/>
    <ellipse cx="22" cy="62" rx="2.8" ry="1.4" transform="rotate(-130 22 62)"/>
    <ellipse cx="27" cy="69" rx="2.8" ry="1.4" transform="rotate(-115 27 69)"/>
    <ellipse cx="27" cy="32" rx="2.8" ry="1.4" transform="rotate(-65 27 32)"/>
  </g>
  <!-- Laurel stem left -->
  <path d="M 27 30 Q 18 50 30 72" stroke="url(#goldDeep)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Laurel wreath: right side -->
  <g fill="url(#gold)" stroke="url(#goldDeep)" stroke-width="0.3">
    <ellipse cx="78" cy="38" rx="2.8" ry="1.4" transform="rotate(50 78 38)"/>
    <ellipse cx="80" cy="46" rx="2.8" ry="1.4" transform="rotate(30 80 46)"/>
    <ellipse cx="80" cy="54" rx="2.8" ry="1.4" transform="rotate(150 80 54)"/>
    <ellipse cx="78" cy="62" rx="2.8" ry="1.4" transform="rotate(130 78 62)"/>
    <ellipse cx="73" cy="69" rx="2.8" ry="1.4" transform="rotate(115 73 69)"/>
    <ellipse cx="73" cy="32" rx="2.8" ry="1.4" transform="rotate(65 73 32)"/>
  </g>
  <!-- Laurel stem right -->
  <path d="M 73 30 Q 82 50 70 72" stroke="url(#goldDeep)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Star at top -->
  <path d="M 50 18 L 51.5 22 L 55.5 22.2 L 52.3 24.7 L 53.5 28.5 L 50 26.3 L 46.5 28.5 L 47.7 24.7 L 44.5 22.2 L 48.5 22 Z" fill="url(#gold)" stroke="url(#goldDeep)" stroke-width="0.3"/>

  <!-- Open book at center -->
  <!-- Book pages background -->
  <path d="M 35 48 L 35 62 Q 42 60 50 62 Q 58 60 65 62 L 65 48 Q 58 46 50 48 Q 42 46 35 48 Z" fill="#ffffff" stroke="url(#goldDeep)" stroke-width="1.2"/>
  <!-- Center spine -->
  <line x1="50" y1="48" x2="50" y2="62" stroke="url(#goldDeep)" stroke-width="1"/>
  <!-- Page lines left -->
  <line x1="38" y1="52" x2="47" y2="51.5" stroke="url(#goldDeep)" stroke-width="0.5"/>
  <line x1="38" y1="55" x2="47" y2="54.5" stroke="url(#goldDeep)" stroke-width="0.5"/>
  <line x1="38" y1="58" x2="47" y2="57.5" stroke="url(#goldDeep)" stroke-width="0.5"/>
  <!-- Page lines right -->
  <line x1="53" y1="51.5" x2="62" y2="52" stroke="url(#goldDeep)" stroke-width="0.5"/>
  <line x1="53" y1="54.5" x2="62" y2="55" stroke="url(#goldDeep)" stroke-width="0.5"/>
  <line x1="53" y1="57.5" x2="62" y2="58" stroke="url(#goldDeep)" stroke-width="0.5"/>

  <!-- Ribbon banner below -->
  <path d="M 32 75 L 50 72 L 68 75 L 64 79 L 50 76 L 36 79 Z" fill="url(#gold)" stroke="url(#goldDeep)" stroke-width="0.5"/>
</svg>
